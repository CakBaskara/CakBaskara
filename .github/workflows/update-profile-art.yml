name: update profile art

on:
  schedule:
    - cron: "17 6 * * *"      # every day at 06:17 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:
      - "build.py"
      - "config.json"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "README.md"
      - "assets/*.svg"
      - "assets/toolbox/*.svg"
      - ".github/workflows/update-profile-art.yml"
  pull_request:
    paths:
      - "build.py"
      - "config.json"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "README.md"
      - "assets/*.svg"
      - "assets/toolbox/*.svg"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: read

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Run tests without write access
        run: python -m unittest discover -s tests -v

  render:
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - name: Stagger scheduled refreshes
        if: github.event_name == 'schedule'
        env:
          PROFILE_REPOSITORY: ${{ github.repository }}
        run: python -c "import hashlib, os, time; delay = int(hashlib.sha256(os.environ['PROFILE_REPOSITORY'].encode()).hexdigest()[:8], 16) % 91; print(f'Waiting {delay}s to spread template traffic'); time.sleep(delay)"

      - name: Verify profile adaptation
        run: python -m unittest discover -s tests -v

      # The owner's custom portrait is preserved; copies get their own avatar.
      - name: Adapt owner and render profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build.py --skip-portrait

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          commit_user_name: ${{ github.repository_owner }}
          commit_user_email: ${{ github.event.repository.owner.id }}+${{ github.repository_owner }}@users.noreply.github.com
          commit_author: ${{ github.repository_owner }} <${{ github.event.repository.owner.id }}+${{ github.repository_owner }}@users.noreply.github.com>
          file_pattern: README.md config.json assets/*.svg assets/toolbox/*.svg assets/contributions.json
