name: update profile art

on:
  schedule:
    - cron: "17 6 * * *"      # every day at 06:17 UTC
  workflow_dispatch:           # lets you run it by hand from the Actions tab
  push:
    paths:
      - "build.py"
      - "config.json"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "README.md"
      - "assets/*.svg"
      - ".github/workflows/update-profile-art.yml"

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Verify profile adaptation
        run: python -m unittest discover -s tests -v

      # The owner's custom portrait is preserved; copies get their own avatar.
      - name: Adapt owner and render profile
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python build.py --skip-portrait

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          commit_user_name: ${{ github.repository_owner }}
          commit_user_email: ${{ github.event.repository.owner.id }}+${{ github.repository_owner }}@users.noreply.github.com
          commit_author: ${{ github.repository_owner }} <${{ github.event.repository.owner.id }}+${{ github.repository_owner }}@users.noreply.github.com>
          file_pattern: README.md config.json assets/*.svg assets/contributions.json
