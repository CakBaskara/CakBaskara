  <g class="ln" style="animation-delay:0.30s"><text class="key" x="26" y="108">Location</text><text class="val" x="134" y="108">Probolinggo, Indonesia</text></g>
  <g class="ln" style="animation-delay:0.39s"><text class="key" x="26" y="138">Stack</text><text class="val" x="134" y="138">Python · TypeScript · JavaScript</text></g>
  <g class="ln" style="animation-delay:0.48s"><text class="key" x="26" y="168">Now</text><text class="val" x="134" y="168">Building data-driven workflow tools</text></g>
  <g class="ln" style="animation-delay:0.57s"><text class="key" x="26" y="198">Focus</text><text class="val" x="134" y="198">Finance · operations · automation</text></g>
  <g class="ln" style="animation-delay:0.66s"><text class="key" x="26" y="228">Projects</text><text class="val" x="134" y="228">Market tools · inspection · budgeting</text></g>
  <g class="ln" style="animation-delay:0.75s"><text class="key" x="26" y="258">Contact</text><text class="val" x="134" y="258">github.com/CakBaskara</text></g>
