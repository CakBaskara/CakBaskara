<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
  <style>
    .key { fill: #39d353; font-size: 15px; }
    .val { fill: #c9d1d9;     font-size: 15px; }
    .mut { fill: #8b949e;  font-size: 15px; }
    .acc { fill: #39d353; font-size: 18px; }
    .b   { font-weight: 700; }
    .ln { opacity: 0; animation: in .55s cubic-bezier(.2,.7,.3,1) forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
    .cur { animation: blink 1.05s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>
  <rect x="0" y="0" width="560" height="420" rx="10" fill="#0d1117"/>
  <rect x=".5" y=".5" width="559" height="419" rx="10" fill="none" stroke="#30363d"/>

  <g class="ln" style="animation-delay:0.12s"><text class="acc b" x="26" y="44">call me BasBass</text></g>
